<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in · ChatApp</title>
  <meta name="theme-color" content="#008069">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body style="overflow:auto">
  <div class="login-page">
    <div class="login-card">
      <img src="/icons/icon-192.png" alt="" width="72" height="72">
      <h1>ChatApp</h1>
      <p>Sign in to start chatting.</p>
      <div id="error" class="err" hidden></div>
      <a id="sso" class="btn" href="/auth/login" hidden>Continue with SSO</a>
      <div id="no-sso" class="warn" hidden>SSO isn't configured on this server yet. Set <code>OIDC_CLIENT_ID</code> and friends (see README).</div>
      <div id="dev" hidden>
        <div class="or">Demo login (local testing)</div>
        <form method="post" action="/auth/dev">
          <input name="name" placeholder="Your name" required maxlength="60" autocomplete="name">
          <input name="email" type="email" placeholder="you@example.com" required autocomplete="email">
          <button class="btn" type="submit">Continue</button>
        </form>
        <div class="warn">Demo login is on: anyone can sign in as any email. Turn it off in production (<code>DEV_LOGIN=0</code>).</div>
      </div>
    </div>
  </div>
  <script src="/login.js"></script>
</body>
</html>
