<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>ChatApp</title>
  <meta name="theme-color" content="#008069" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#202c33" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ChatApp">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <div id="conn" hidden>Connecting…</div>

    <aside id="sidebar">
      <header class="bar">
        <div id="me" class="avatar"></div>
        <div class="grow title">Chats</div>
        <button id="btn-new" class="icon-btn" aria-label="New chat" title="New chat">
          <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
        </button>
        <div class="menu-wrap">
          <button id="btn-menu" class="icon-btn" aria-label="Menu" title="Menu">
            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
          </button>
          <div id="menu" class="menu" hidden>
            <div id="menu-who" class="menu-who"></div>
            <button id="menu-notif">Enable notifications</button>
            <button id="menu-logout">Log out</button>
          </div>
        </div>
      </header>
      <div class="searchbox"><input id="filter" type="search" placeholder="Search chats" autocomplete="off" aria-label="Search chats"></div>
      <div id="chatlist" role="list"></div>
      <div id="list-empty" class="empty-note" hidden>No chats yet.<br>Tap <b>+</b> to start one.</div>
    </aside>

    <main id="conv">
      <div id="placeholder">
        <svg viewBox="0 0 24 24" width="84" height="84"><path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-5 4V6a2 2 0 0 1 1-2z" opacity=".35"/></svg>
        <h2>ChatApp</h2>
        <p>Select a chat, or start a new one with the <b>+</b> button.</p>
      </div>
      <section id="thread" hidden>
        <header class="bar" id="convhead">
          <button id="btn-back" class="icon-btn" aria-label="Back">
            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>
          </button>
          <div id="head-avatar" class="avatar"></div>
          <div class="grow headtext">
            <div id="head-name" class="title"></div>
            <div id="head-status" class="sub"></div>
          </div>
          <button id="btn-call" class="icon-btn call-header-button" type="button" aria-label="Start voice call" title="Start voice call" hidden>
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.56 3.57.56.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.61 21 3 13.39 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.24.19 2.45.56 3.57a1 1 0 0 1-.25 1.02z"/></svg>
          </button>
        </header>
        <div id="messages" aria-live="polite"></div>
        <form id="composer" autocomplete="off">
          <div id="emoji-picker" class="emoji-picker" role="dialog" aria-label="Emoji picker" hidden></div>
          <div id="reply-preview" class="reply-preview" hidden>
            <div class="reply-copy">
              <div id="reply-name" class="reply-name"></div>
              <div id="reply-text" class="reply-text"></div>
            </div>
            <button id="btn-cancel-reply" type="button" class="icon-btn" aria-label="Cancel reply">×</button>
          </div>
          <div id="voice-preview" class="voice-preview" aria-live="polite" hidden></div>
          <div class="composer-row">
            <input id="file-input" type="file" accept="image/jpeg,image/png,image/gif,image/webp,image/bmp" multiple hidden>
            <button id="btn-attach" type="button" class="attach-toggle" aria-label="Attach images" title="Attach images (10 MB max)">
              <svg viewBox="0 0 24 24" width="22" height="22"><path d="M21.44 11.05 12.25 20.24a6 6 0 0 1-8.49-8.49l10-10a4 4 0 0 1 5.66 5.66l-10 10a2 2 0 0 1-2.83-2.83l9.19-9.19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="btn-emoji" type="button" class="emoji-toggle" aria-label="Choose emoji" aria-controls="emoji-picker" aria-expanded="false">😊</button>
            <button id="btn-voice" type="button" class="voice-toggle" aria-label="Record voice note" title="Record voice note">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-3.07A7 7 0 0 0 19 11h-2Z"/></svg>
            </button>
            <textarea id="input" rows="1" placeholder="Type a message" aria-label="Message" enterkeyhint="send" maxlength="4000"></textarea>
            <button id="btn-send" type="submit" class="send" aria-label="Send">
              <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
            </button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <div id="call-overlay" class="call-overlay" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
